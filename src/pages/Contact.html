      <!-- Contact Form Section -->
      <div class="w-full lg:w-1/2 p-8 bg-white">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Send us a message</h2>
        <form action="#" method="POST" class="space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700"
              >Name</label
            >
            <input
              type="text"
              id="name"
              name="name"
              class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700"
              >Phone</label
            >
            <input
              type="tel"
              id="phone"
              name="phone"
              class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
          <div>
            <label for="message" class="block text-sm font-medium text-gray-700"
              >Message</label
            >
            <textarea
              id="message"
              name="message"
              rows="4"
              class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 focus:ring-4 focus:ring-green-300"
          >
            Send
          </button>
        </form>
      </div>
    </div>

    <div class="flex justify-center mt-[60px] rems-center mb-3">

        class="w-[1422px] h-96 border-2 border-gray-400 rounded-lg overflow-hidden shadow-lg"
      >

          class="w-full h-full"
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d6763.365195469518!2d104.85467468399743!3d11.566217435117254!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1skm!2skh!4v1739156172096!5m2!1skm!2skh"

          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
